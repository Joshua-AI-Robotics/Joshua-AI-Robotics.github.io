name: Build and refresh website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * *'

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  JOSHUA_PREVIEW_REVISION: ba5ba11c50dfc9407bcb413d13910a1b3420a8d3

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: Joshua-AI-Robotics/Joshua
          ref: develop
          path: .joshua-source
          persist-credentials: false
      - name: Select pre-merge preview source
        if: github.event_name == 'pull_request'
        run: |
          if [ ! -f .joshua-source/docs/device_software_catalog/catalog.schema.json ]; then
            git -C .joshua-source fetch --depth=1 origin "$JOSHUA_PREVIEW_REVISION"
            git -C .joshua-source checkout --detach "$JOSHUA_PREVIEW_REVISION"
          fi
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install catalog validation dependency
        run: python -m pip install jsonschema==4.26.0
      - name: Validate browser scripts
        run: |
          node --check js/tabs.js
          node --check js/site-content.js
          node --check js/prompt-demo.js
          node --check js/integrations.js
      - name: Package static site
        run: |
          mkdir -p _site/data
          cp -R index.html css js assets docs CNAME .nojekyll _site/
      - name: Export committed Joshua catalog
        run: python .joshua-source/tools/hardware_catalog.py --export --output _site/data/catalog.json
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
